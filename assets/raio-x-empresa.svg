<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="rx-t rx-d" class="rx" xmlns:c2pa="http://c2pa.org/manifest">
<title id="rx-t">Raio X da empresa</title>
<desc id="rx-d">Uma empresa entra na máquina de raio X e sai como um esqueleto: cabeça = vendas, costelas = insumos (pessoas, recursos, conhecimento), braços = comissões de vendedores e trabalhadores, pernas = comissão da logística de entregas, bacia = lucro.</desc>
<style>
.rx{--bg:#0b1b2c;--film:#0e2436;--bone:#e8f2f8;--glow:#7fd3f0;--steel:#3b566c;--steel2:#29404f;--amber:#f2b84b;--ink:#9fb7c8;--co:#577a91;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.rx text{fill:var(--bone);font-size:14px}
.rx .lbl-t{font-weight:600;font-size:15px}
.rx .lbl-v{fill:var(--glow);font-size:13px}
.rx .lbl-s{fill:var(--ink);font-size:12px}
.rx .bone{fill:none;stroke:var(--bone);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:url(#rx-glow)}
.rx .bone.thin{stroke-width:4}
.rx .lead{stroke:var(--glow);stroke-width:1.2;stroke-dasharray:3 4;fill:none;opacity:.8}
.rx .t,.rx .anim{animation-duration:12s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-in-out;animation-delay:-10s}
/* empresa entra na máquina */
.rx .empresa{animation-name:rx-move}
@keyframes rx-move{0%{transform:translateX(0);opacity:1}25%{transform:translateX(350px);opacity:1}55%{transform:translateX(350px);opacity:1}62%{transform:translateX(350px);opacity:0}63%{transform:translateX(0);opacity:0}92%{transform:translateX(0);opacity:0}100%{transform:translateX(0);opacity:1}}
.rx .belt{stroke-dasharray:14 10;animation:rx-belt 1.2s linear infinite}
@keyframes rx-belt{to{stroke-dashoffset:-24}}
/* máquina */
.rx .glass{animation-name:rx-glass}
@keyframes rx-glass{0%,25%{opacity:.3}30%,55%{opacity:.88}62%,100%{opacity:.3}}
.rx .xin{opacity:0;animation-name:rx-xin}
@keyframes rx-xin{0%,27%{opacity:0}32%,55%{opacity:1}60%,100%{opacity:0}}
.rx .beam{opacity:0;animation-name:rx-beam;animation-timing-function:linear}
@keyframes rx-beam{0%,28%{opacity:0;transform:translateX(0)}29%{opacity:1;transform:translateX(0)}41%{transform:translateX(160px)}54%{opacity:1;transform:translateX(0)}55%,100%{opacity:0}}
.rx .led{animation:rx-led .8s steps(2) infinite}
.rx .led2{animation-delay:.4s}
@keyframes rx-led{50%{opacity:.25}}
.rx .ray{opacity:0;animation-name:rx-ray}
@keyframes rx-ray{0%,54%{opacity:0}57%,62%{opacity:1}68%,100%{opacity:0}}
/* filme */
.rx .lightbox{animation-name:rx-film}
@keyframes rx-film{0%,55%{opacity:.35}60%,96%{opacity:1}100%{opacity:.35}}
.rx .bone{stroke-dasharray:1;stroke-dashoffset:0;animation-name:rx-draw}
@keyframes rx-draw{0%,57%{stroke-dashoffset:1;opacity:0}58%{opacity:1}72%,95%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.rx .vert{animation-name:rx-fade}
.rx .lab{animation-name:rx-fade}
@keyframes rx-fade{0%,64%{opacity:0}70%,95%{opacity:1}100%{opacity:0}}
.rx .d1{animation-delay:-9.6s}.rx .d2{animation-delay:-9.3s}.rx .d3{animation-delay:-9s}.rx .d4{animation-delay:-8.7s}.rx .d5{animation-delay:-8.4s}.rx .d6{animation-delay:-8.1s}
@media (prefers-reduced-motion:reduce){.rx *{animation:none!important}.rx .empresa{opacity:1}}
</style>
<defs>
  <filter id="rx-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="rx-filmg" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#1d4b68"/><stop offset="1" stop-color="#0e2436"/></radialGradient>
  <linearGradient id="rx-beamg" x1="0" x2="1"><stop offset="0" stop-color="#7fd3f0" stop-opacity="0"/><stop offset=".5" stop-color="#7fd3f0" stop-opacity=".9"/><stop offset="1" stop-color="#7fd3f0" stop-opacity="0"/></linearGradient>
  <clipPath id="rx-win"><rect x="415" y="290" width="170" height="205"/></clipPath>
</defs>

<rect width="1200" height="600" fill="#0b1b2c"/>

<!-- esteira -->
<g>
  <rect x="30" y="500" width="600" height="14" rx="7" fill="#29404f"/>
  <line class="belt" x1="40" y1="500" x2="620" y2="500" stroke="#5c7b90" stroke-width="3"/>
  <g fill="#3b566c"><circle cx="60" cy="526" r="9"/><circle cx="180" cy="526" r="9"/><circle cx="300" cy="526" r="9"/><circle cx="420" cy="526" r="9"/><circle cx="540" cy="526" r="9"/></g>
  <text x="60" y="566" class="lbl-s">1 · EMPRESA</text>
  <text x="415" y="566" class="lbl-s">2 · MÁQUINA DE RAIO X</text>
  <text x="670" y="580" class="lbl-s">3 · ESQUELETO DA EMPRESA</text>
</g>

<!-- máquina: fundo -->
<rect x="395" y="240" width="210" height="262" rx="14" fill="#16293a"/>

