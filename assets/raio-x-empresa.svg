<text x="416" y="266" style="font-weight:700;letter-spacing:3px;font-size:14px">RAIO X</text>
<circle class="led" cx="562" cy="260" r="6" fill="#f2b84b"/>
<circle class="led led2" cx="584" cy="260" r="6" fill="#7fd3f0"/>
<rect class="glass t" x="415" y="290" width="170" height="205" fill="#06121d"/>
<g class="xin t" clip-path="url(#rx-win)" fill="none" stroke="#7fd3f0" stroke-width="2">
  <rect x="430" y="334" width="140" height="166" rx="3" stroke-dasharray="5 4"/>
  <rect x="438" y="304" width="124" height="24" rx="4" stroke-dasharray="5 4"/>
  <g stroke="#e8f2f8" stroke-width="4" stroke-linecap="round" filter="url(#rx-glow)">
    <circle cx="500" cy="370" r="13"/>
    <line x1="500" y1="386" x2="500" y2="448"/>
    <path d="M500 398c-12 0-22 4-24 14M500 398c12 0 22 4 24 14M500 414c-10 0-18 3-20 11M500 414c10 0 18 3 20 11"/>
    <path d="M476 392l-10 38M524 392l10 38M492 450l-6 38M508 450l6 38"/>
  </g>
</g>
<g class="beam t"><rect x="415" y="290" width="10" height="205" fill="url(#rx-beamg)"/><line x1="420" y1="290" x2="420" y2="495" stroke="#e8f2f8" stroke-width="1.5"/></g>
<g class="ray t" stroke="#7fd3f0" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7" fill="none">
  <path d="M608 330L648 290M608 380H648M608 430L648 470"/>
</g>

<!-- filme / negatoscópio -->
<rect x="650" y="40" width="520" height="515" rx="10" fill="#081521" stroke="#3b566c" stroke-width="2"/>
<rect class="lightbox t" x="660" y="50" width="500" height="495" rx="6" fill="url(#rx-filmg)"/>
<text x="676" y="78" class="lbl-s" style="letter-spacing:2px">RAIO X · EMPRESA</text>
<text x="1146" y="78" class="lbl-s" text-anchor="end">por venda de R$ 15,00</text>

