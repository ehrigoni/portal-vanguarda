<g class="empresa t">
  <rect x="88" y="304" width="124" height="24" rx="4" fill="#f2b84b"/>
  <text x="150" y="321" text-anchor="middle" style="fill:#0b1b2c;font-weight:700;font-size:13px;letter-spacing:2px">EMPRESA</text>
  <rect x="80" y="334" width="140" height="166" rx="3" fill="#577a91"/>
  <g fill="#f2d9a0">
    <rect x="96" y="350" width="22" height="18" rx="2"/><rect x="139" y="350" width="22" height="18" rx="2"/><rect x="182" y="350" width="22" height="18" rx="2"/>
    <rect x="96" y="382" width="22" height="18" rx="2"/><rect x="139" y="382" width="22" height="18" rx="2"/><rect x="182" y="382" width="22" height="18" rx="2"/>
    <rect x="96" y="414" width="22" height="18" rx="2"/><rect x="182" y="414" width="22" height="18" rx="2"/>
  </g>
